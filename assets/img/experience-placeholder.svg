<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="expBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05425C" />
      <stop offset="50%" stop-color="#086288" />
      <stop offset="100%" stop-color="#1B3B4B" />
    </linearGradient>

    <!-- Inner Card Gradient -->
    <linearGradient id="innerCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E4D6E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#062E40" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Glow -->
    <radialGradient id="expGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#97D7FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#97D7FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#expBgGrad)" />
  <rect width="600" height="380" fill="url(#expGlow)" />

  <!-- Subtle Grid Pattern Lines -->
  <g stroke="#97D7FF" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Inner Frame -->
  <rect x="40" y="35" width="520" height="310" rx="16" fill="url(#innerCardGrad)" stroke="#97D7FF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Top Decorative Header Dots -->
  <circle cx="70" cy="65" r="5" fill="#FFEFC4" opacity="0.9" />
  <circle cx="86" cy="65" r="5" fill="#97D7FF" opacity="0.8" />
  <circle cx="102" cy="65" r="5" fill="#4D8DBA" opacity="0.7" />

  <!-- Central Visual: Camera & Documentation Graphic -->
  <g transform="translate(300, 160)">
    <!-- Outer Floating Ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#97D7FF" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 6" />
    
    <!-- Central Circle -->
    <circle cx="0" cy="0" r="48" fill="#086288" stroke="#FFEFC4" stroke-width="2" />
    
    <!-- Camera / Image Icon -->
    <g transform="translate(-20, -18) scale(1.6)" fill="none" stroke="#FFEFC4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="15" rx="3" />
      <circle cx="8" cy="7.5" r="1.5" fill="#FFEFC4" />
      <path d="m21 15-5-5-5 5" />
      <path d="m14 14 2.5-2.5 4.5 4.5" />
    </g>
  </g>

  <!-- Badge / Tag Indicator -->
  <g transform="translate(300, 260)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#05425C" stroke="#97D7FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFEFC4" text-anchor="middle" letter-spacing="0.5">
      DOKUMENTASI KEGIATAN
    </text>
  </g>

  <!-- Subtitle -->
  <text x="300" y="305" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#97D7FF" opacity="0.75" text-anchor="middle">
    Foto Dokumentasi / Sertifikat Kegiatan
  </text>
</svg>
