<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Qwen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #chat-container {
      width: 90%;
      max-width: 600px;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    #chat-log {
      flex-grow: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 18px;
      max-width: 75%;
    }

    .user {
      align-self: flex-end;
      background-color: #dcf8c6;
    }

    .bot {
      align-self: flex-start;
      background-color: #e5e5ea;
    }

    #input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid #eee;
    }

    #user-input {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 18px;
    }

    #send-btn {
      margin-left: 10px;
      padding: 10px 20px;
      background-color: #0084ff;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
    }

    #api-key-input {
      padding: 10px;
      margin-bottom: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="api-key-container">
      <input type="password" id="api-key-input" placeholder="Masukkan DashScope API Key kamu di sini" />
    </div>
    <div id="chat-log">
      <div class="message bot">Halo! Saya adalah Qwen. Silakan masukkan API Key kamu di atas dan mulai chatting!</div>
    </div>
    <div id="input-area">
      <input type="text" id="user-input" placeholder="Ketik pesan..." />
      <button id="send-btn">Kirim</button>
    </div>
  </div>

  <script>
    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key-input');

    function addMessage(sender, text) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', sender);
      messageDiv.textContent = text;
      chatLog.appendChild(messageDiv);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!message || !apiKey) return;

      addMessage('user', message);
      userInput.value = '';

      const response = await fetch('https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          "model": "qwen-flash",
          "input": {
            "prompt": message
          },
          "parameters": {
            "result_format": "text"
          }
        })
      });

      const data = await response.json();
      const reply = data.output.text;
      addMessage('bot', reply);
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeypress = (e) => {
      if (e.key === 'Enter') sendMessage();
    };
  </script>
</body>
</html>
